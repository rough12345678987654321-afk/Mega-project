name: Build Sway Android app

on:
  push:
    branches: ["arena/89910d1d-mega-project"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: android-app

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace --console=plain > build-output.txt 2>&1
          result=$?
          tail -n 90 build-output.txt
          grep -E 'FAILURE:|What went wrong:|Execution failed|Caused by:|^e:|error:|FAILED' build-output.txt | tail -n 20 | while IFS= read -r line; do echo "::error::$line"; done
          exit "$result"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-diagnostics
          path: android-app/build-output.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sway-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
